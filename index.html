<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlertConnect - Secure Emergency Communication</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#047857">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 600: '#059669', 700: '#047857', 800: '#065f46' },
                        red: { 600: '#DC2626', 700: '#B91C1C' }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col items-center justify-center bg-slate-900 text-slate-100 selection:bg-emerald-500 selection:text-white">
    <div id="app-container" class="w-full max-w-md h-full sm:h-[844px] sm:max-h-[90vh] bg-slate-50 text-slate-900 sm:rounded-3xl sm:shadow-2xl flex flex-col relative overflow-hidden">
        <div id="view-root" class="flex-1 flex flex-col overflow-y-auto relative">
            <div class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-emerald-600 border-t-transparent"></div>
            </div>
        </div>
        <div id="navigation-root"></div>
        <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/js/app.js"></script>
</body>
</html>
